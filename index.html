<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kopi & Code Fridays</title>

<style>
:root{
    --linkedin:#0A66C2;
    --bg:#0b0d12;
    --card:#141721;
    --card-hover:#1c202e;
    --text:#f3f4f6;
    --muted:#9ca3af;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Inter, Arial, sans-serif;
}

.hero{
    background:linear-gradient(135deg,#0A66C2,#004182);
    padding:80px 20px;
    text-align:center;
}

.hero h1{
    font-size:4rem;
    margin-bottom:12px;
}

.hero p{
    font-size:1.3rem;
    opacity:.9;
}

.container{
    max-width:1200px;
    margin:0 auto;
    padding:60px 24px;
}

.section-title{
    font-size:2rem;
    margin-bottom:24px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:24px;
}

.card{
    background:var(--card);
    border-radius:20px;
    padding:28px;
    text-decoration:none;
    color:white;
    border:1px solid rgba(255,255,255,.05);
    transition:all .25s ease;
    display:block;
}

.card:hover{
    transform:translateY(-6px);
    background:var(--card-hover);
    border-color:#0A66C2;
}

.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:999px;
    background:#0A66C2;
    font-size:.85rem;
    margin-bottom:14px;
}

.card h3{
    font-size:1.5rem;
    margin-bottom:12px;
}

.card p{
    color:var(--muted);
    line-height:1.6;
}

.spacer{
    margin-top:70px;
}
